[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers -m "not live"
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: isolated tests with fakes and mocks (fast, default)
    e2e: full CLI conversation flows with injected collaborators
    integration: tests that cross module boundaries with mocks
    live: real Ollama or weather network calls (opt-in)
