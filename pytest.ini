[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 30
console_output_style = progress
addopts =
    -ra
    --strict-markers
    -m "not live"
    --tb=short
    --cov=lib
    --cov=main
    --cov-report=term-missing
    --html=reports/report.html
    --self-contained-html
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: isolated tests with fakes and mocks (fast, default)
    e2e: full CLI conversation flows with injected collaborators
    integration: tests that cross module boundaries with mocks
    live: real Ollama or weather network calls (opt-in)
    deepeval: LLM quality evals (custom metrics offline; judge metrics are live)
    negative: failure, validation, and error-path coverage
    regression: guards against previously observed defects
